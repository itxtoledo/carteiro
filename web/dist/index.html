<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carteiro</title>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f2f3f3;
        color: #16191f;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      main { max-width: 640px; text-align: center; padding: 0 1.5rem; }
      code {
        background: #eaeded;
        border-radius: 6px;
        padding: 0.1em 0.4em;
        font-size: 0.9em;
      }
      a { color: #0073bb; }
    </style>
  </head>
  <body>
    <main>
      <h1>Carteiro</h1>
      <p>The web panel has not been built into this binary.</p>
      <p>
        Build it with <code>cd web &amp;&amp; npm ci &amp;&amp; npm run build</code>,
        then recompile the Go binary (<code>make build</code>).
      </p>
    </main>
  </body>
</html>
