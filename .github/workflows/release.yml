name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0). The image is built and published to GHCR, then a GitHub Release with the binaries is created."
        required: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: image-amd64+arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-architecture builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64 + linux/arm64)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # workflow_dispatch uses the "tag" input; tag pushes use ref_name.
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "" ]; then VERSION="${{ github.event.inputs.tag }}"; fi
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_ENV"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${VERSION}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            --push .

  binaries:
    name: build-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: linux_amd64
            goos: linux
            goarch: amd64
          - target: linux_arm64
            goos: linux
            goarch: arm64
          - target: darwin_amd64
            goos: darwin
            goarch: amd64
          - target: darwin_arm64
            goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (build the embedded dashboard)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the React dashboard
        run: |
          cd web
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build static binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then VERSION="${{ github.event.inputs.tag }}"; VERSION="${VERSION#v}"; fi
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "carteiro_${VERSION}_${{ matrix.target }}" ./cmd/carteiro
          tar czf "carteiro_${VERSION}_${{ matrix.target }}.tar.gz" "carteiro_${VERSION}_${{ matrix.target }}"

      - name: Checksums
        run: sha256sum carteiro_*.tar.gz > carteiro_checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            carteiro_*.tar.gz
            carteiro_checksums.txt
          retention-days: 1

  release:
    name: create-github-release
    needs: [image, binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries

      - name: Build release notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then RANGE="${PREV}..${TAG}"; else RANGE=""; fi
          {
            echo "### Docker image"
            echo "Published to GHCR (linux/amd64 + linux/arm64):"
            echo "\`ghcr.io/${{ github.repository }}:${VERSION}\` (also tagged \`latest\`)"
            echo ""
            echo "### Binaries"
            echo "\`\`\`"
            ls -1 carteiro_*.tar.gz
            echo "\`\`\`"
            echo ""
            echo "### Changes"
            echo "\`\`\`"
            git log --oneline --no-decorate ${RANGE} | head -60 || true
            echo "\`\`\`"
          } > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.tag }}
          body_path: release_notes.md
          files: |
            carteiro_*.tar.gz
            carteiro_checksums.txt
          draft: false
          prerelease: false
